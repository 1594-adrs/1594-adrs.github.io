<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        background: #0a0a0f;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: 'JetBrains Mono', monospace;
        color: #e6ffe6;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 72px;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 255, 136, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 136, 0.08) 1px, transparent 1px);
        background-size: 32px 32px;
        opacity: 0.5;
      }
      .glow {
        position: absolute;
        top: -200px;
        right: -160px;
        width: 620px;
        height: 620px;
        background: radial-gradient(circle, rgba(0, 255, 136, 0.16) 0%, rgba(0, 255, 136, 0) 70%);
      }
      .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 56px;
      }
      .logo {
        width: 300px;
        height: 300px;
        flex: none;
      }
      .name {
        position: relative;
        font-size: 54px;
        font-weight: 700;
        color: #f2fff2;
        letter-spacing: 0.5px;
      }
      .role {
        position: relative;
        margin-top: 14px;
        font-size: 26px;
        font-weight: 500;
        color: #00ff88;
      }
      .domain {
        position: relative;
        margin-top: 40px;
        font-size: 20px;
        color: #7fa88f;
      }
      .domain::before {
        content: '> ';
        color: #00ff88;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="card">
      <img class="logo" src="../../public/logo.svg" alt="" />
      <div>
        <div class="name">Andrés Rincón</div>
        <div class="role">Software Developer · Full Stack</div>
        <div class="domain">1594-adrs.github.io</div>
      </div>
    </div>
  </body>
</html>
