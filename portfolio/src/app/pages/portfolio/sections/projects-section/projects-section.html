<section class="projects-section" id="projects" appRevealOnScroll #reveal="reveal">
  <div class="reveal-container" [class.revealed]="reveal.revealed()" [class.hiding]="reveal.hiding()">
    <h2 class="section-title">// Projects</h2>

    <div class="projects-grid">
      @for (project of projects; track project.id) {
        <div class="project-card" [class.featured]="project.featured">
          <div class="card-topbar">
            <span class="card-dot"></span>
            <span class="card-dot"></span>
            <span class="card-dot"></span>
            <span class="card-filename">{{ project.title | lowercase }}.proj</span>
          </div>

          <div class="project-content">
            <h3 class="project-title">{{ project.title }}</h3>
            <p class="project-description">{{ project.description }}</p>

            <div class="technologies">
              @for (tech of project.technologies; track tech) {
                <span class="tech-badge">{{ tech }}</span>
              }
            </div>

            <div class="project-links">
              <button
                class="btn btn-github"
                (click)="openGithub(project.githubUrl)"
                [title]="'View on GitHub: ' + project.title"
              >
                <i class="fab fa-github"></i>
                GitHub
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
