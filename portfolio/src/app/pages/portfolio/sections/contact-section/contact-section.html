<section class="contact-section" id="contact" appRevealOnScroll #reveal="reveal">
  <div
    class="reveal-container"
    [class.revealed]="reveal.revealed()"
    [class.hiding]="reveal.hiding()"
  >
    <h2 class="section-title">// Contact</h2>

    <div class="contact-card terminal-card">
      <div class="terminal-header">
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-title">contact.sh</span>
      </div>

      <div class="terminal-body">
        <p class="contact-lead">Let's work together.</p>
        <p class="contact-availability">{{ profile.availability }}</p>

        <address class="contact-details">
          <div class="contact-detail">
            <app-icon name="target" />
            <span>{{ profile.location }} &middot; {{ profile.timezone }}</span>
          </div>
          <div class="contact-detail">
            <app-icon name="envelope" />
            <a class="contact-email" [href]="'mailto:' + profile.email">{{ profile.email }}</a>
          </div>
        </address>

        <div class="contact-actions">
          <a class="btn btn-primary" [href]="'mailto:' + profile.email">
            <app-icon name="envelope" />
            Email me
          </a>
          <a
            class="btn"
            href="https://www.linkedin.com/in/1594-adrs/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn profile"
          >
            <app-icon name="linkedin" />
            LinkedIn
          </a>
          <a
            class="btn"
            href="https://github.com/1594-adrs"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub profile"
          >
            <app-icon name="github" />
            GitHub
          </a>
          @if (profile.resumeUrl) {
            <a
              class="btn"
              [href]="profile.resumeUrl"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Download CV (PDF)"
            >
              <app-icon name="terminal" />
              CV · PDF
            </a>
          }
        </div>
      </div>
    </div>
  </div>
</section>
