<section class="hero-container" id="home" aria-label="Hero section">
  <app-eye aria-hidden="true"></app-eye>

  <div class="hero-content">
    <div class="staggered-text">
      <p class="greeting animate-fade-up">&gt; Hello, I am</p>
      <h1 class="name animate-fade-up-delay" data-text="Andrés Rincón">Andrés Rincón</h1>
      <p class="role animate-fade-up-delay-2">Full Stack Developer<span class="cursor">_</span></p>
    </div>

    <div class="profile-image-container">
      <div class="image-frame">
        <div class="image-placeholder">
          @if (!imageFailed()) {
            <img
              src="LOGO.png"
              alt="Andrés David Rincón"
              class="profile-img"
              width="300"
              height="300"
              (error)="onImageError()"
            />
          }
          <div class="image-overlay"></div>
        </div>
        <div class="frame-border"></div>
      </div>
    </div>
  </div>

  <div class="scroll-indicator">
    <div class="scroll-arrow"></div>
    <span>scroll</span>
  </div>
</section>
