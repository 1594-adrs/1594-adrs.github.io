<section class="hero-container" id="home" aria-label="Hero section">
  <app-eye aria-hidden="true"></app-eye>

  <div class="hero-content">
    <div class="staggered-text">
      <p class="greeting animate-fade-up">&gt; Hello, I am</p>
      <h1 class="name animate-fade-up-delay" [attr.data-text]="name" [attr.aria-label]="name">
        <span aria-hidden="true">{{ name }}</span>
      </h1>
      <p class="role animate-fade-up-delay-2">
        {{ role }}<span class="cursor" aria-hidden="true">_</span>
      </p>
      <p class="tagline animate-fade-up-delay-2">{{ tagline }}</p>
      <p class="availability animate-fade-up-delay-2">
        <span class="status-dot" aria-hidden="true"></span>{{ availability }}
      </p>

      <div class="hero-cta animate-fade-up-delay-2">
        <a class="btn btn-primary" href="#projects">View Projects</a>
        @if (resumeUrl) {
          <a
            class="btn btn-outline"
            [href]="resumeUrl"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Download CV (PDF)"
          >
            Download CV
          </a>
        }
      </div>
    </div>

    <div class="profile-image-container">
      <div class="image-frame">
        <div class="image-placeholder">
          <pre class="monogram" aria-hidden="true">{{ monogram }}</pre>
          <div class="image-overlay"></div>
        </div>
        <div class="frame-border"></div>
      </div>
    </div>
  </div>

  <div class="scroll-indicator">
    <div class="scroll-arrow"></div>
    <span>scroll</span>
  </div>
</section>
