<app-loading-screen></app-loading-screen>
<app-phosphor-field [active]="isAppPage()"></app-phosphor-field>
<div class="crt-overlay" aria-hidden="true"></div>
<div class="noise-overlay" aria-hidden="true"></div>

<app-navbar [class.hidden]="!isAppPage()"></app-navbar>
<app-social-buttons [class.hidden]="!isAppPage()"></app-social-buttons>
<app-progress-bar [class.hidden]="!isAppPage()"></app-progress-bar>

<main id="main-content">
  <router-outlet />
</main>

<footer class="footer" [class.hidden]="!isAppPage()">
  <div class="footer-content">
    <ul class="footer-links" aria-label="Quick links">
      @for (social of socialNetworks; track social.label) {
        <li>
          <a
            [href]="social.url"
            [attr.target]="social.url.startsWith('mailto:') ? null : '_blank'"
            [attr.rel]="social.url.startsWith('mailto:') ? null : 'noopener noreferrer'"
            >{{ social.label }}</a
          >
        </li>
      }
      @if (profile.resumeUrl) {
        <li>
          <a [href]="profile.resumeUrl" target="_blank" rel="noopener noreferrer">CV · PDF</a>
        </li>
      }
    </ul>
    <div class="footer-bottom">
      <p class="footer-copy">&copy; 2026 Andrés Rincón</p>
    </div>
  </div>
</footer>
