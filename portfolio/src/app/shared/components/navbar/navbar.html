<nav class="navbar" aria-label="Main navigation">
  <div class="navbar-container">
    <div class="logo">
      <span class="logo-text">.A.D.R.S.</span>
    </div>

    <button
      class="menu-toggle"
      [class.active]="isMenuOpen()"
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="nav-menu"
    >
      <span class="hamburger"></span>
    </button>

    <ul class="nav-links" [class.active]="isMenuOpen()" id="nav-menu" role="list">
      @for (link of navLinks; track link.id) {
        @if (link.isButton) {
          <li class="nav-item">
            <a
              [href]="'/Andres_Rincon_CV.pdf'"
              target="_blank"
              rel="noopener noreferrer"
              class="nav-link-btn"
            >
              {{ link.label }}
            </a>
          </li>
        } @else {
          <li class="nav-item">
            <a
              [routerLink]="'/'"
              [fragment]="link.id"
              class="nav-link"
              [class.active]="activeLink() === link.id"
              (click)="setActiveLink(link.id)"
            >
              {{ link.label }}
            </a>
          </li>
        }
      }
    </ul>
  </div>
</nav>
