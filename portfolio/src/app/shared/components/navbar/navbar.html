<nav class="navbar" aria-label="Main navigation" (keydown.escape)="closeMenu()">
  <div class="navbar-container">
    <a
      class="logo"
      href="#home"
      aria-label="Andrés Rincón — back to top"
      (click)="scrollToSection('home'); $event.preventDefault()"
    >
      <span class="logo-text">.A.D.R.S.</span>
    </a>

    <button
      #menuToggle
      class="menu-toggle"
      [class.active]="isMenuOpen()"
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="nav-menu"
    >
      <span class="hamburger-icon">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </span>
    </button>

    <ul
      class="nav-links"
      [class.active]="isMenuOpen()"
      id="nav-menu"
      [inert]="!isMenuOpen() && isMobileMenu()"
    >
      @for (link of navLinks; track link.id) {
        @if (link.isButton) {
          <li class="nav-item">
            <a
              [href]="link.href"
              target="_blank"
              rel="noopener noreferrer"
              class="nav-link-btn"
              (click)="isMenuOpen.set(false)"
            >
              {{ link.label }}
            </a>
          </li>
        } @else {
          <li class="nav-item">
            <a
              class="nav-link"
              [class.active]="activeLink() === link.id"
              (click)="scrollToSection(link.id); $event.preventDefault()"
              [href]="'#' + link.id"
            >
              {{ link.label }}
            </a>
          </li>
        }
      }
    </ul>
  </div>
</nav>
