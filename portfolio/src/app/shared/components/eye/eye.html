<div class="eye-container" aria-hidden="true">
  <div class="eye" #eye>
    <div class="eye-outer">
      <div class="eye-veins"></div>
    </div>
    <div class="eye-inner">
      <div class="iris" [style.transform]="irisTransform()">
        <div class="pupil"></div>
        <div class="reflection"></div>
      </div>
    </div>
  </div>
</div>
