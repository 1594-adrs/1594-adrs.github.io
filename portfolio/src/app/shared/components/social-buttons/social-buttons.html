<div class="social-buttons-container" role="list" aria-label="Social links">
  @for (social of socialNetworks; track social.label) {
    <a
      [href]="social.url"
      [attr.aria-label]="social.label"
      target="_blank"
      rel="noopener noreferrer"
      class="social-button"
      role="listitem"
    >
      <app-icon [name]="social.iconName" />
      <span class="tooltip">{{ social.label }}</span>
    </a>
  }
</div>
