<ul class="social-buttons-container" aria-label="Social links">
  @for (social of socialNetworks; track social.label) {
    <li>
      <a
        [href]="social.url"
        [attr.aria-label]="social.label"
        [attr.target]="social.url.startsWith('mailto:') ? null : '_blank'"
        [attr.rel]="social.url.startsWith('mailto:') ? null : 'noopener noreferrer'"
        class="social-button"
      >
        <app-icon [name]="social.iconName" />
        <span class="tooltip">{{ social.label }}</span>
      </a>
    </li>
  }
</ul>
